# Workflow réutilisable : Node avec pnpm (lint, typecheck, test, audit), chaque script lancé seulement s'il existe.
# Appel : jobs.node.uses: xsom-consulting/.github/.github/workflows/ci-node.yml@main
name: CI Node

on:
  workflow_call:
    inputs:
      dossier:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  node:
    name: Node (lint, types, tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.dossier }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version lue dans packageManager de package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.dossier }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.dossier }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: lint, typecheck, test (scripts présents seulement)
        run: |
          for s in lint typecheck test; do
            if node -e "process.exit(require('./package.json').scripts?.['$s'] ? 0 : 1)"; then
              pnpm run "$s"
            else
              echo "Pas de script $s."
            fi
          done
      - name: pnpm audit (échec si gravité haute)
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level high
