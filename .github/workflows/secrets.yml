# Workflow réutilisable : recherche de secrets dans tout l'historique (gitleaks) et d'instructions cachées
# dans les fichiers lus par les assistants de code (secret-guard hidden).
# Appel : jobs.secrets.uses: xsom-consulting/.github/.github/workflows/secrets.yml@main
name: Secrets

on:
  workflow_call:
    inputs:
      fichiers-ia:
        description: Fichiers lus par les assistants, vérifiés pour les caractères cachés (séparés par des espaces)
        type: string
        default: "AGENTS.md CLAUDE.md"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (gitleaks, historique complet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Installer gitleaks (somme de contrôle vérifiée)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "${archive}" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
      - name: gitleaks git
        run: gitleaks git . --redact --no-banner

  instructions-cachees:
    name: Instructions cachées (secret-guard hidden)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Installer secret-guard (dernière version publiée)
        run: go install github.com/xsom-consulting/secret-guard/cmd/secret-guard@latest
      - name: Aucun caractère caché dans les fichiers lus par les assistants
        env:
          FICHIERS: ${{ inputs.fichiers-ia }}
        run: |
          statut=0
          for f in $FICHIERS; do
            [ -f "$f" ] || continue
            if ! "$(go env GOPATH)/bin/secret-guard" hidden "$f"; then
              echo "::error file=$f::caractères cachés ou analyse incomplète"
              statut=1
            fi
          done
          exit "$statut"
